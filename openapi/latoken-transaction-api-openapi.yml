  /v2/auth/transaction/{id}:
    get:
      security:
      - api_key: []
        api_signature: []
      summary: Get transaction by id
      tags:
      - Transaction
      operationId: getTransactionById
      parameters:
      - name: id
        in: path
        required: true
        description: transaction id
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/json_TransactionAdapter'
  /v2/transaction/bindings:
    get:
      summary: Request all active bindings
      tags:
      - Transaction
      description: Request list of all active bindings
      operationId: getBindings
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: ''
                type: array
                items:
                  $ref: '#/components/schemas/json_BindingAdapter'
components:
  schemas:
    json_PageAdapterOfTransactionAdapter:
      type: object
      title: PageAdapterOfTransactionAdapter
      required:
      - pageSize
      - hasContent
      - first
      - hasNext
      properties:
        pageSize:
          example: 20
          readOnly: false
          description: amount of transactions per page
          type: integer
          format: int64
        hasContent:
          example: true
          readOnly: false
          description: true if page is not empty
          type: boolean
        first:
          example: true
          readOnly: false
          description: whether there is page before
          type: boolean
        content:
          readOnly: false
          description: ''
          type: array
          items:
            $ref: '#/components/schemas/json_TransactionAdapter'
        hasNext:
          example: true
          readOnly: false
          description: true if there is page after that page
          type: boolean
      example:
        hasNext: true
        content:
        - id: 1506f937-dd29-4645-a213-dd05dd21f53f
          status: TRANSACTION_STATUS_PENDING
