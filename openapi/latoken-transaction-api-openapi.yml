openapi: 3.2.0
info:
  title: Latoken Transaction API
  version: V2
  x-logo:
    url: ./logo.png
    altText: Latoken logo
  description: 'Operations tagged Transaction across 2 of this provider''s published API definitions: latoken-api-v2-swagger.json, latoken-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.latoken.com/
tags:
- name: Transaction
paths:
  /v2/auth/transaction:
    get:
      security:
      - api_key: []
        api_signature: []
      summary: Request deposits and withdrawals
      tags:
      - Transaction
      operationId: getUserTransactions
      parameters:
      - name: page
        in: query
        description: Request deposits and withdrawals
        schema:
          type: string
      - name: size
        in: query
        description: Request deposits and withdrawals
        schema:
          type: string
      responses:
        '200':
          description: on success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/json_PageAdapterOfTransactionAdapter'
        '400':
          description: if request is not valid
  /v2/auth/transaction/bindings:
    get:
      security:
      - api_key: []
        api_signature: []
      summary: Request all currencies that have active bindings
      tags:
      - Transaction
      operationId: getCurrenciesBindings
      responses:
        '200':
          description: on success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/json_PossibleBindingEntity'
  /v2/auth/transaction/bindings/{currency}:
    get:
      security:
      - api_key: []
        api_signature: []
      summary: Request bindings for specific currency
      tags:
      - Transaction
      operationId: getCurrencyBindings
      parameters:
      - name: currency
        in: path
        required: true
        description: id of currency
        schema:
          type: string
      responses:
        '200':
          description: on success
          content:
            application/json:
              schema:
                description: on success
                type: array
                items:
                  $ref: '#/components/schemas/json_BindingAdapter_Transaction'
        '400':
          description: if request is invalid
        '404':
          description: if there is no such currency
  /v2/auth/transaction/depositAddress:
    post:
      security:
      - api_key: []
        api_signature: []
      summary: Request deposit address to make deposit
      tags:
      - Transaction
      operationId: generateDepositAddress
      responses:
        '200':
          description: on success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/json_DepositAddressReply'
        '400':
          description: if request is invalid
        '404':
          description: if there is no such currency or binding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/json_DepositAddressRequest'
        description: request with details about currency and input method
  /v2/auth/transaction/withdraw:
    post:
      security:
      - api_key: []
        api_signature: []
      summary: Request withdrawal
      tags:
      - Transaction
      operationId: withdrawMoney
      responses:
        '200':
          description: on success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/json_WithdrawalReceiptAdapter'
        '400':
          description: if request is invalid
        '404':
          description: if there is no currency or binding
      x-code-samples:
      - lang: JavaScript
        source: "\nconst request = require('request')\nconst crypto = require('crypto')\n\nconst apiKey = 'Your Latoken API key'\nconst apiSecret = 'Your Latoken API secret'\nconst method = 'POST';\nconst baseUrl = 'https://api.latoken.com'\nconst endpoint = '/v2/auth/transaction/withdraw'\n\nconst params = {\n    twoFaCode: '123456',\n    currencyBinding: '620f2019-33c0-423b-8a9d-cde4d7f8ef7f',\n    amount: '100.50',\n    recipientAddress: '0xdf12d43f23d4f23d4fd23f4d2f3d4f23d4f',\n    memo: 'additional_field'\n}\nconst body = JSON.stringify(params);\nconst bodySignParams = Object.entries(params).map(([key, val]) => key + '=' + val).join('&');\n\nconst signature = crypto\n    .createHmac('sha256', apiSecret)\n    .update(method + endpoint + bodySignParams)\n    .digest('hex')\n\nconst options = {\n    method: method,\n    url: baseUrl + endpoint,\n    headers: {\n        'Content-Type': 'application/json',\n        'X-LA-APIKEY': apiKey,\n        'X-LA-SIGNATURE': signature\n    },\n    body: body\n}\n\nrequest.post(\n    options,\n    function (error, response, responseBody) {\n        console.log('response:', JSON.stringify(responseBody))\n    }\n)\n\n"
      - lang: Python
        source: "import requests\nimport datetime\nimport hashlib\nimport hmac\n\napiKey = 'Your Latoken API key'\napiSecret = b'Your Latoken API secret'\nbaseUrl = 'https://api.latoken.com'\nendpoint = '/v2/auth/transaction/withdraw'\n\nparams = {\n    'twoFaCode': '123456',\n    'currencyBinding': '620f2019-33c0-423b-8a9d-cde4d7f8ef7f',\n    'amount': '100.50',\n    'recipientAddress': '0x34d3f4d3f4d3f4d3f4d3f4d3f4d'\n}\nserializeFunc = map(lambda it : it[0] + '=' + str(it[1]), params.items())\nbodyParams = '&'.join(serializeFunc)\n                  \nsignature = hmac.new(\n    apiSecret, \n    ('POST' + endpoint + bodyParams).encode('ascii'), \n    hashlib.sha512\n)\n\nurl = baseUrl + endpoint\n\nresponse = requests.post(\n    url,\n    headers = {\n        'Content-Type': 'application/json',\n        'X-LA-APIKEY': apiKey,\n        'X-LA-SIGNATURE': signature.hexdigest(),\n        'X-LA-DIGEST': 'HMAC-SHA512'\n    },\n    json = params\n)\n\nprint(response.json())"
      - lang: Php
        source: "<?php\n\n$apiKey = '4737b23b-06fc-4e47-b55f-b872e00dee4b';\n$apiSecret = 'N2NjNWE1OTktOTFkMi00MWMzLTkwZDYtY2UxNjAyMzg0NGZj';\n$baseUrl = 'https://api.k8s-dev1.nekotal.tech';\n$endpoint = '/v2/auth/transaction/withdraw';\n$method = 'POST';\n\n$params = [\n    'twoFaCode' => '142097',\n    'currencyBinding' => '620f2019-33c0-423b-8a9d-cde4d7f8ef7f',\n    'amount' => 100.50,\n    'recipientAddress' => '0xdf12d43f23d4f23d4fd23f4d2f3d4f23d4f',\n    'memo' => 'some additional information'\n];\n\n$bodyParams = join('&', array_map(\n    function($key, $val) { return $key.'='.$val; }, \n    array_keys($params), array_values($params))\n);\n\n$signature = hash_hmac('sha256', $method.$endpoint.$bodyParams, $apiSecret, FALSE);\n\n$url = $baseUrl.$endpoint;\n$options = array(\n    'http' => array(\n        'ignore_errors'=> TRUE,\n        'method' => $method,\n        'header' => array(\n             'Content-Type:application/json',\n             'X-LA-APIKEY:'.$apiKey,\n             'X-LA-SIGNATURE:'.$signature\n        ),\n        'content' => json_encode($params, JSON_THROW_ON_ERROR | JSON_PRETTY_PRINT, 1)\n    )\n);\nvar_dump($bodyParams);\nvar_dump(json_encode($params, JSON_THROW_ON_ERROR | JSON_PRETTY_PRINT, 1));\n$context = stream_context_create($options);\n$response = file_get_contents($url, FALSE, $context);\n\nvar_dump($response);\n\n?>"
      - lang: Java
        source: "package api.client;\n\nimport com.sun.org.apache.xerces.internal.impl.dv.util.HexBin;\nimport javax.crypto.Mac;\nimport javax.crypto.spec.SecretKeySpec;\nimport java.io.IOException;\nimport java.net.URI;\nimport java.net.http.HttpClient;\nimport java.net.http.HttpRequest;\nimport java.net.http.HttpResponse;\nimport java.security.InvalidKeyException;\nimport java.security.NoSuchAlgorithmException;\nimport java.util.HashMap;\nimport java.util.Vector;\n\npublic class RestApiV1 {\n    public static void runSample() throws InvalidKeyException, NoSuchAlgorithmException, IOException, InterruptedException {\n        final String apiKey = \"Your Latoken API key\";\n        final String apiSecret = \"Your Latoken API secret\";\n        final String baseUrl = \"https://api.latoken.com\";\n        final String endpoint = \"/v2/auth/transaction/withdraw\";\n\n        HashMap<String, String> params = new HashMap<>();\n        params.put(\"twoFaCode\", \"123456\");\n        params.put(\"currencyBinding\", \"620f2019-33c0-423b-8a9d-cde4d7f8ef7f\");\n        params.put(\"amount\", \"100.50\");\n        params.put(\"recipientAddress\", \"0x32df234df23d4f32d4f23d4f2d34fd23f4\");\n        params.put(\"memo\", \"...\");\n\t\t\n\t\t/* Body parameters for request (json) */\n        Vector<String> bodyParams = new Vector<>();\n        params.forEach((key, value) -> bodyParams.add(\"\\\"\" + key + \"\\\": \\\"\" + value + \"\\\"\"));\n        final String bodyContent = \"{\" + String.join(\",\", bodyParams) + \"}\";\n        \n\t\t/* Body parameters for signature */\n        Vector<String> temporaryParams = new Vector<>();\n        params.forEach((key, value) -> temporaryParams.add(key + \"=\" + value));\n        final String signableBodyParams = String.join(\"&\", temporaryParams);\n\n        /* Signature */\n        Mac crypto = Mac.getInstance(\"HmacSHA256\");\n        crypto.init(new SecretKeySpec(apiSecret.getBytes(\"UTF-8\"), \"HmacSHA256\"));\n        String signature = HexBin.encode( crypto.doFinal(\n                              (\"POST\" + endpoint + signableBodyParams).getBytes(\"UTF-8\")\n                           )).toLowerCase();\n\n        /* Requesting */\n        HttpClient client = HttpClient.newHttpClient();\n        HttpRequest request = HttpRequest.newBuilder()\n                .uri(URI.create(baseUrl + endpoint))\n\t\t\t\t.header(\"Content-Type\", \"application/json\")\n                .header(\"X-LA-APIKEY\", apiKey)\n                .header(\"X-LA-SIGNATURE\", signature)\n                .POST(HttpRequest.BodyPublishers.ofString(bodyContent))\n                .build();\n        HttpResponse<String> response =  client.send(request, HttpResponse.BodyHandlers.ofString());\n\n        System.out.println(response.body().toString());\n    }\n}"
      - lang: C#
        source: "using System;\nusing System.Collections.Generic;\nusing System.Net;\nusing System.Text;\nusing System.Linq;\nusing System.IO;\n\nusing System.Security.Cryptography;\n\npublic class Program\n{\n\tpublic static void Main()\n\t{\n\t\tvar apiKey = \"Your Latoken API key\";\n\t\tvar apiSecret = \"Your Latoken API secret\";\n\t\tvar baseUrl = \"https://api.latoken.com\";\n\t\tvar endpoint = \"/v2/auth/transaction/withdraw\";\n\t\tvar method = \"POST\";\n\n\t\t/* form parameters */\n\t\tvar parameters = new Dictionary<string, string>(){\n\t\t\t{\"twoFaCode\", \"123456\"},\n\t\t\t{\"currencyBinding\", \"620f2019-33c0-423b-8a9d-cde4d7f8ef7f\"},\n\t\t\t{\"amount\", \"100.50\"},\n\t\t\t{\"recipientAddress\", \"0x23d4f2d34f23d4f2d34fd23f4d2f34d\"},\n\t\t\t{\"memo\", \"additional_info\"}\n\t\t};\n\t\tvar bodyContent = \"{\" + string.Join(\",\", parameters.Select(kvp => \"\\\"\" + kvp.Key + \"\\\": \\\"\" + kvp.Value + \"\\\"\").ToArray()) + \"}\";\n\t\tvar signableParams = string.Join(\"&\", parameters.Select(kvp => kvp.Key + \"=\" + kvp.Value).ToArray());\n\n\t\t/* sign request */\n\t\tHMAC crypto = new HMACSHA256(Encoding.ASCII.GetBytes(apiSecret));\n\t\tbyte[] signBytes = crypto.ComputeHash(Encoding.ASCII.GetBytes(method + endpoint + signableParams));\n\t\tstring signature = string.Empty;\n\t\tsignBytes.ToList().ForEach(b => signature += b.ToString(\"x2\"));\n\n\t\t/* create request */\n\t\tvar request = HttpWebRequest.CreateHttp(baseUrl + endpoint);\n\t\trequest.Method = method;\n\t\trequest.ContentType = \"application/json\";\n\t\trequest.Headers.Add(\"X-LA-APIKEY\", apiKey);\n\t\trequest.Headers.Add(\"X-LA-SIGNATURE\", signature);\n\t\trequest.ContentLength = bodyContent.Length;\n\t\tvar body = request.GetRequestStream();\n\t\tbody.Write(Encoding.ASCII.GetBytes(bodyContent), 0, bodyContent.Length);\n\t\tbody.Close();\n\n\t\t/* get response */\n\t\ttry\n\t\t{\n\t\t\tvar response = (HttpWebResponse)request.GetResponse();\n\t\t\tvar responseString = new StreamReader(response.GetResponseStream()).ReadToEnd();\n\t\t\tConsole.WriteLine(responseString);\n\t\t}\n\t\tcatch (WebException we)\n\t\t{\n\t\t\tvar errorResponse = we.Response as HttpWebResponse;\n\t\t\tvar responseString = new StreamReader(errorResponse.GetResponseStream()).ReadToEnd();\n\t\t\tConsole.WriteLine(responseString);\n\t\t}\n\t}\n}\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/json_WithdrawalRequest'
        description: request with withdrawal details
  /v2/auth/transaction/withdraw/cancel:
    post:
      security:
      - api_key: []
        api_signature: []
      summary: Cancel withdrawal
      tags:
      - Transaction
      operationId: cancelWithdrawal
      responses:
        '200':
          description: on success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/json_ReplyBase'
        '400':
          description: if request is invalid
        '404':
          description: if there is no such withdrawal
