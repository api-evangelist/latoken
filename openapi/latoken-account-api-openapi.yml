components:
  schemas:
    json_BalanceAdapter:
      type: object
      title: BalanceAdapter
      properties:
        id:
          example: 1e200836-a037-4475-825e-f202dd0b0e92
          readOnly: false
          description: ''
          type: string
        status:
          example: ACCOUNT_STATUS_ACTIVE
          readOnly: false
          description: ''
          type: string
        type:
          example: ACCOUNT_TYPE_WALLET
          readOnly: false
          description: ''
          type: string
          enum:
          - ACCOUNT_TYPE_WALLET
          - ACCOUNT_TYPE_SPOT
          - ACCOUNT_TYPE_FUTURES
          - ACCOUNT_TYPE_GLOBAL_MARKETS
        timestamp:
          example: 1566408522980
          readOnly: false
          description: ''
          type: integer
          format: int64
        currency:
          example: 6ae140a9-8e75-4413-b157-8dd95c711b23
          readOnly: false
          description: ''
          type: string
        available:
          example: '898849.3300'
          readOnly: false
          description: ''
          type: string
        blocked:
          example: '4581.9510'
          readOnly: false
          description: ''
          type: string
      example:
        id: 1e200836-a037-4475-825e-f202dd0b0e92
        status: ACCOUNT_STATUS_ACTIVE
        type: ACCOUNT_TYPE_WALLET
        timestamp: 1566408522980
        currency: 6ae140a9-8e75-4413-b157-8dd95c711b23
        available: '898849.3300'
        blocked: '4581.9510'
      description: ''
  securitySchemes:
    api_key:
      type: apiKey
      name: X-LA-APIKEY
      in: header
    api_signature:
      type: apiKey
      name: X-LA-SIGNATURE
      in: header
x-refined-from:
- latoken-api-v2-swagger.json
- latoken-openapi.yml
