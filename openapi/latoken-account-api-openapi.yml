      - lang: JavaScript
        source: "const request = require('request')\nconst crypto = require('crypto')\n\nconst apiKey = 'Your Latoken API key'\nconst apiSecret = 'Your Latoken API secret'\nconst baseUrl = 'https://api.latoken.com'\nconst endpoint = '/v2/auth/account/filtered'\nconst method = 'GET';\n\nconst params = {\n    currency: '0c3a106d-bde3-4c13-a26e-3fd2394529e5,BTC'\n    type: 'ACCOUNT_TYPE_WALLET'\n}\nconst queryParams = Object.entries(params).map(([key, val]) => key + '=' + val).join('&');\n\nconst signature = crypto\n    .createHmac('sha256', apiSecret)\n    .update(method + endpoint + queryParams)\n    .digest('hex')\n\nconst options = {\n    method: method,\n    url: baseUrl + endpoint + '?' + queryParams,\n    headers: {\n        'X-LA-APIKEY': apiKey,\n        'X-LA-SIGNATURE': signature\n    }\n}\n\nrequest.get(\n    options,\n    function (error, response, responseBody) {\n        console.log('response:', JSON.stringify(responseBody))\n    }\n)\n"
      - lang: Python
        source: "import requests\nimport hashlib\nimport hmac\n\napiKey = 'Your Latoken API key'\napiSecret = b'Your Latoken API secret'\nbaseUrl = 'https://api.latoken.com'\nendpoint = '/v2/auth/account/filtered'\n\nparams = {\n    'currency': '0c3a106d-bde3-4c13-a26e-3fd2394529e5,BTC',\n    'type': 'ACCOUNT_TYPE_WALLET'\n}\nserializeFunc = map(lambda it : it[0] + '=' + str(it[1]), params.items())\nqueryParams = '&'.join(serializeFunc)\n                  \nsignature = hmac.new(\n    apiSecret, \n    ('GET' + endpoint + queryParams).encode('ascii'), \n    hashlib.sha512\n)\n\nurl = baseUrl + endpoint + '?' + queryParams\n\nresponse = requests.get(\n    url,\n    headers = {\n        'X-LA-APIKEY': apiKey,\n        'X-LA-SIGNATURE': signature.hexdigest(),\n        'X-LA-DIGEST': 'HMAC-SHA512'\n    }\n)\n\nprint(response.json())"
      - lang: Php
        source: "<?php\n\n$apiKey = 'Your Latoken API key';\n$apiSecret = 'Your Latoken API secret';\n$baseUrl = 'https://api.latoken.com';\n$endpoint = '/v2/auth/account/filtered';\n$method = 'GET';\n\n$params = [\n    'currency' => '0c3a106d-bde3-4c13-a26e-3fd2394529e5,BTC'\n    'type' => 'ACCOUNT_TYPE_WALLET'\n];\n\n$queryParams = join('&', array_map(\n    function($key, $val) { return $key.'='.$val; }, \n    array_keys($params), array_values($params))\n);\n\n$signature = hash_hmac('sha256', $method.$endpoint.$queryParams, $apiSecret, FALSE);\n\n$url = $baseUrl.$endpoint.'?'.$queryParams;\n$options = array(\n    'http' => array(\n        'ignore_errors'=> TRUE,\n        'method' => $method,\n        'header' => array(\n             'X-LA-APIKEY:'.$apiKey,\n             'X-LA-SIGNATURE:'.$signature\n        )\n    )\n);\n\n$context = stream_context_create($options);\n$response = file_get_contents($url, FALSE, $context);\n\nvar_dump($response);\n?>"
