components:
  schemas:
    PaymentMethodPublic:
      type: object
      title: Payment Method Public
      properties:
        type:
          type: string
          enum:
          - PAYMENT_TYPE_UNSPECIFIED
          - PAYMENT_TYPE_BANK_TRANSFER
          - PAYMENT_TYPE_BKASH
          - PAYMENT_TYPE_ROCKET
          - PAYMENT_TYPE_NAGAD
          - PAYMENT_TYPE_UPI
          example: PAYMENT_TYPE_BANK_TRANSFER
        bank:
          type: string
          example: BANK NAME
        account:
          type: string
          example: 1234123412341234
        name:
          type: string
          example: NAME SURNAME
      description: Payment Method Public Entity
    Error:
      type: object
      title: Error
      properties:
        message:
          type: string
          example: '...'
        status:
          type: string
          example: FAILURE
        error:
          type: string
          example: INVALID_ARGUMENT
      description: Error Entity
    ConfirmOrderRequest:
      type: object
      title: ConfirmOrderRequest
      properties:
        order:
          type: string
          example: 53e8911a-caf6-4fb6-92dd-ced31b0eaf90
      description: ConfirmOrderRequest Entity
    UserPublic:
      type: object
      title: User Public
      properties:
        online:
          type: boolean
          example: true
        nickname:
          type: string
          example: cointrader
      description: User Public Entity
    CompleteOrderRequest:
      type: object
      title: CompleteOrderRequest
      properties:
        order:
          type: string
          example: 53e8911a-caf6-4fb6-92dd-ced31b0eaf90
      description: CompleteOrderRequest Entity
    OrdersList:
      type: object
      title: Orders List
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        currentPage:
          example: 1
          minimum: 1
          type: integer
        lastPage:
          example: 1
          minimum: 1
          type: integer
        size:
          example: 50
          minimum: 1
          type: integer
    CreateOrderRequest:
      type: object
      title: CreateOrderRequest
      properties:
        offer:
          type: string
          example: 32ba928f-02c3-4d62-a455-1e36dc1d6b64
        amountCrypto:
          type: string
          example: 0.5
        amountFiat:
          type: string
          example: 100
        paymentMethod:
          type: string
          example: 1c18d0bb-511d-41c5-8fb2-66626531d59d
      description: CreateOrderRequest Entity
    Order:
      type: object
      title: Order
      properties:
        id:
          type: string
          example: 3d7e1b02-c7f7-49c2-912e-5f4dc9460f8e
        amountCrypto:
          type: string
          example: '0.345678956789000000'
        amountFiat:
          type: string
          example: '1000.000000000000000000'
        offer:
          $ref: '#/components/schemas/Offer'
        status:
          type: string
          enum:
          - ORDER_STATUS_UNSPECIFIED
          - ORDER_STATUS_CREATED
          - ORDER_STATUS_CANCELED
          - ORDER_STATUS_PAID
          - ORDER_STATUS_APPEAL
          - ORDER_STATUS_COMPLETED
          example: ORDER_STATUS_PAID
        method:
          $ref: '#/components/schemas/PaymentMethodPublic'
        appeal:
          $ref: '#/components/schemas/Appeal'
        user:
          $ref: '#/components/schemas/UserPublic'
        type:
          type: string
          enum:
          - ORDER_TYPE_UNSPECIFIED
          - ORDER_TYPE_SELL
          - ORDER_TYPE_BUY
          example: ORDER_TYPE_BUY
        createdAt:
          type: string
          example: '2021-08-19T15:56:16.323Z'
        updatedAt:
          type: string
          example: '2021-08-19T15:56:16.323Z'
      description: Order Entity
    CancelOrderRequest:
      type: object
      title: CancelOrderRequest
      properties:
        order:
          type: string
          example: 53e8911a-caf6-4fb6-92dd-ced31b0eaf90
      description: CancelOrderRequest Entity
    Offer:
      type: object
      title: Offer
      properties:
        id:
          type: string
          example: 3d7e1b02-c7f7-49c2-912e-5f4dc9460f8e
        cryptoTag:
          type: string
          example: BTC
        fiatTag:
          type: string
          example: USD
        amount:
          type: string
          example: '0.500368396618455100'
        availableAmount:
          type: string
          example: '0.400368396618455140'
        limits:
          type: object
          properties:
            min:
              type: string
              example: '0.000100000000000000'
            max:
              type: string
              example: '0.005000000000000000'
        rate:
          type: object
          properties:
            type:
              type: string
              enum:
              - RATE_TYPE_FIXED
              - RATE_TYPE_FLOAT_PERCENT
              - RATE_TYPE_FLOAT_VALUE
              - RATE_TYPE_FLOAT_PERCENT_AND_VALUE
              example: RATE_TYPE_FLOAT_PERCENT
            value:
              type: string
              example: '24703558.793020000000000000'
        merchant:
          $ref: '#/components/schemas/UserPublic'
        type:
          type: string
          enum:
          - OFFER_TYPE_UNSPECIFIED
          - OFFER_TYPE_SELL
          - OFFER_TYPE_BUY
          example: OFFER_TYPE_BUY
        status:
          type: string
          enum:
          - OFFER_STATUS_UNSPECIFIED
          - OFFER_STATUS_ACTIVE
          - OFFER_STATUS_NOT_ACTIVE
          - OFFER_STATUS_DELETED
          example: OFFER_STATUS_ACTIVE
        terms:
          type: string
          example: Buy bitcoin
        method:
          $ref: '#/components/schemas/PaymentMethodPublic'
        acceptableMethod:
          type: string
          example: null
        createdAt:
          type: string
          example: '2021-08-19T15:56:16.323Z'
        updatedAt:
          type: string
          example: '2021-08-20T17:12:30.332Z'
      description: Offer Entity
    UnauthorizedError:
      type: object
      title: Unauthorized Error
      properties:
        result:
          type: boolean
          example: false
        message:
          type: string
          example: user must be authenticated
        status:
          type: string
          example: FAILURE
        error:
          type: string
          example: UNAUTHORIZED
      description: Unauthorized Error Entity
    ServiceUnavailableError:
      type: object
      title: Service Unavailable Error
      properties:
        message:
          type: string
          example: service unavailable
        status:
          type: string
          example: FAILURE
        error:
          type: string
          example: SERVICE_UNAVAILABLE
      description: Service Unavailable Error Entity
    Appeal:
      type: object
      title: Appeal
      properties:
        id:
          type: string
          example: 3d7e1b02-c7f7-49c2-912e-5f4dc9460f8e
        appealer:
          type: string
          example: 5b144930-5da9-42af-9038-cd95b87eeb84
        reason:
          type: string
          example: Did not receive funds
        description:
          type: string
          example: Sent fiat, but merchant didn't complete order
        proof:
          type: array
          items:
            type: string
            example: https://url.to.your/proof
        status:
          type: string
          example: APPEAL_STATUS_PENDING
        createdAt:
          type: string
          example: '2021-08-19T15:56:16.323Z'
        updatedAt:
          type: string
          example: '2021-08-19T15:56:16.323Z'
      description: Appeal Entity
  securitySchemes:
    api_key:
      type: apiKey
      name: X-LA-APIKEY
      in: header
    api_signature:
      type: apiKey
      name: X-LA-SIGNATURE
      in: header
x-refined-from:
- latoken-p2p-api-swagger.json
- latoken-p2p-openapi.yml
