        source: "import requests\nimport datetime\nimport hashlib\nimport hmac\n\napiKey = 'Your Latoken API key'\napiSecret = b'Your Latoken API secret'\nbaseUrl = 'https://api.latoken.com'\nendpoint = '/v2/auth/order/place'\n\nparams = {\n    'baseCurrency': '0c3a106d-bde3-4c13-a26e-3fd2394529e5',\n    'quoteCurrency': '620f2019-33c0-423b-8a9d-cde4d7f8ef7f',\n    'side': 'SELL',\n    'condition': 'GOOD_TILL_CANCELLED',\n    'type': 'LIMIT',\n    'clientOrderId': 'myCustomOrder',\n    'price': '131.50',\n    'quantity': '100'\n}\nserializeFunc = map(lambda it : it[0] + '=' + str(it[1]), params.items())\nbodyParams = '&'.join(serializeFunc)\n                  \nsignature = hmac.new(\n    apiSecret, \n    ('POST' + endpoint + bodyParams).encode('ascii'), \n    hashlib.sha512\n)\n\nurl = baseUrl + endpoint\n\nresponse = requests.post(\n    url,\n    headers = {\n        'Content-Type': 'application/json',\n        'X-LA-APIKEY': apiKey,\n        'X-LA-SIGNATURE': signature.hexdigest(),\n        'X-LA-DIGEST': 'HMAC-SHA512'\n    },\n    json = params\n)\n\nprint(response.json())"
