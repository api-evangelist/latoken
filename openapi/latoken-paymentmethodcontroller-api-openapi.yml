components:
  schemas:
    CreatePaymentMethodRequest:
      type: object
      title: CreatePaymentMethodRequest
      properties:
        type:
          type: string
          enum:
          - PAYMENT_TYPE_UNSPECIFIED
          - PAYMENT_TYPE_BANK_TRANSFER
          - PAYMENT_TYPE_BKASH
          - PAYMENT_TYPE_ROCKET
          - PAYMENT_TYPE_NAGAD
          - PAYMENT_TYPE_UPI
          example: PAYMENT_TYPE_BANK_TRANSFER
        bank:
          type: string
          example: BANK NAME
        account:
          type: string
          example: '1234123412341234'
        name:
          type: string
          example: NAME SURNAME
      description: CreatePaymentMethodRequest Entity
    Error:
      type: object
      title: Error
      properties:
        message:
          type: string
          example: '...'
        status:
          type: string
          example: FAILURE
        error:
          type: string
          example: INVALID_ARGUMENT
      description: Error Entity
    UpdatePaymentMethodRequest:
      type: object
      title: UpdatePaymentMethodRequest
      properties:
        id:
          type: string
          example: 1c18d0bb-511d-41c5-8fb2-66626531d59d
        type:
          type: string
          enum:
          - PAYMENT_TYPE_UNSPECIFIED
          - PAYMENT_TYPE_BANK_TRANSFER
          - PAYMENT_TYPE_BKASH
          - PAYMENT_TYPE_ROCKET
          - PAYMENT_TYPE_NAGAD
          - PAYMENT_TYPE_UPI
          example: PAYMENT_TYPE_BANK_TRANSFER
        bank:
          type: string
          example: BANK NAME
        account:
          type: string
          example: 1234123412341234
        name:
          type: string
          example: NAME SURNAME
      description: UpdatePaymentMethodRequest Entity
    PaymentMethodsList:
      type: array
      title: Payment Methods List
      items:
        $ref: '#/components/schemas/PaymentMethodPrivate'
    PaymentMethodPrivate:
      type: object
      title: Payment Method Private
      properties:
        id:
          type: string
          example: 3d7e1b02-c7f7-49c2-912e-5f4dc9460f8e
        type:
          type: string
          enum:
          - PAYMENT_TYPE_UNSPECIFIED
          - PAYMENT_TYPE_BANK_TRANSFER
          - PAYMENT_TYPE_BKASH
          - PAYMENT_TYPE_ROCKET
          - PAYMENT_TYPE_NAGAD
          - PAYMENT_TYPE_UPI
          example: PAYMENT_TYPE_BANK_TRANSFER
        bank:
          type: string
          example: BANK NAME
        account:
          type: string
          example: 1234123412341234
        name:
          type: string
          example: NAME SURNAME
        createdAt:
          type: string
          example: '2021-08-19T15:56:16.323Z'
        updatedAt:
          type: string
          example: '2021-08-19T15:56:16.323Z'
      description: Payment Method Private Entity
    RemovePaymentMethodRequest:
      type: object
      title: RemovePaymentMethodRequest
      properties:
        id:
          type: string
          example: 1c18d0bb-511d-41c5-8fb2-66626531d59d
      description: RemovePaymentMethodRequest Entity
    UnauthorizedError:
      type: object
      title: Unauthorized Error
      properties:
        result:
          type: boolean
          example: false
        message:
          type: string
          example: user must be authenticated
        status:
          type: string
          example: FAILURE
        error:
          type: string
          example: UNAUTHORIZED
      description: Unauthorized Error Entity
    ServiceUnavailableError:
      type: object
      title: Service Unavailable Error
      properties:
        message:
          type: string
          example: service unavailable
        status:
          type: string
          example: FAILURE
        error:
          type: string
          example: SERVICE_UNAVAILABLE
      description: Service Unavailable Error Entity
  securitySchemes:
    api_key:
      type: apiKey
      name: X-LA-APIKEY
      in: header
    api_signature:
      type: apiKey
      name: X-LA-SIGNATURE
      in: header
