openapi: 3.2.0
info:
  title: Latoken Payment Method Controller API
  version: V1
  x-logo:
    url: ./logo.png
  description: 'Operations tagged PaymentMethodController across 2 of this provider''s published API definitions: latoken-p2p-api-swagger.json, latoken-p2p-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: /pay/v1
- url: https://api.latoken.com/pay/v1
tags:
- name: PaymentMethodController
paths:
