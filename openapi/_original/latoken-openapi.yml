swagger: '2.0'
info:
  version: V2
  x-logo:
    url: ./logo.png
    altText: Latoken logo
  description: "Welcome to LATOKEN Public API.\n\n# Basic Information\n\n- The base address is **https://api.latoken.com/v2**\n- All methods are returning JSON object\n- If you want to generate an API key for your account, please go to **https://exchange.latoken.com/account/apikeys**\n- You can refer to this guide for further information: **https://latoken.zendesk.com/hc/en-us/articles/360012042260-How-to-generate-an-API-key-**\n\n# WebSocket, P2P\n- Latoken WebSocket API documentation is located at [**https://api.latoken.com/doc/ws/**](/doc/ws/)\n\n- Latoken P2P API documentation is located at [**https://api.latoken.com/doc/p2p/**](/doc/p2p/)\n\n# Official client libraries\nOne may find official Latoken API client libraries for a set of programming languages:\n- C#: https://github.com/LATOKEN/latoken-api-v2-dotnet-client\n- Python: https://github.com/LATOKEN/latoken-api-v2-python-client\n- Java: https://github.com/LATOKEN/latoken-java-client\n- CCXT libraries: https://github.com/ccxt/ccxt\n\
    \n  - Examples: \n\n    - Python: https://github.com/ccxt/ccxt/blob/master/examples/py/latoken-example.py\n  \n    - Javascript: https://github.com/ccxt/ccxt/blob/master/examples/js/latoken-example.js\n\n# Error Format\nErrors are returned in JSON format as follows:\n```json\n{\n  \"result\": false,\n  \"message\": \"unable to find something somewhere\",\n  \"error\": \"NOT_FOUND\",\n  \"status\": \"FAILURE\"\n}\n```\n### Error Codes\nHere is list of possible error codes:\n\n- ``INTERNAL_ERROR`` - internal server error. You can contact our support to solve this problem.\n- ``SERVICE_UNAVAILABLE`` - requested information currently not available. You can contact our support to solve this problem or retry later.\n- ``NOT_AUTHORIZED`` - user's query not authorized. Check if you are logged in.\n- ``FORBIDDEN`` - you don't have enough access rights.\n- ``BAD_REQUEST`` - some bad request, for example bad fields values or something else. Read response message for more information.\n- ``NOT_FOUND``\
    \ - entity not found. Read message for more information.\n- ``ACCESS_DENIED`` - access is denied. Probably you don't have enough access rights, you contact our support.\n- ``REQUEST_REJECTED`` - user's request rejected for some reasons. Check error message.\n- ``HTTP_MEDIA_TYPE_NOT_SUPPORTED`` - http media type not supported.\n- ``MEDIA_TYPE_NOT_ACCEPTABLE`` - media type not acceptable\n- ``METHOD_ARGUMENT_NOT_VALID`` - one of method argument is invalid. Check argument types and error message for more information.\n- ``VALIDATION_ERROR`` - check `errors` field to get reasons.\n- ``ACCOUNT_EXPIRED`` - restore your account or create a new one.\n- ``BAD_CREDENTIALS`` - invalid username or password.\n- ``COOKIE_THEFT`` - cookie has been stolen. Let's try reset your cookies.\n- ``CREDENTIALS_EXPIRED`` - credentials expired.\n- ``INSUFFICIENT_AUTHENTICATION`` - for example, 2FA required.\n- ``UNKNOWN_LOCATION`` - user logged from unusual location, email confirmation required.\n- ``TOO_MANY_REQUESTS``\
    \ - too many requests at the time. A response header `X-Rate-Limit-Remaining` indicates the number of allowed request per a period.\n\n# Public And Private Endpoints\nLatoken API has two type of endpoints. **Public** and **Signed** endpoints. Public endpoints can be accessed by anyone and they mostly contain methods that return public market data (Order book, ticker, trades, exchange info etc...). Signed endpoints contain user related data and enable an opportunity to create, cancel and see the state of user accounts, orders and balances. Any signed endpoint contains `/auth/` in its path.\n\n# Authorization\nFor signed endpoints, client should have `Public Key` and `Private Key`. The request can be signed using `HMAC-SHA256, HMAC-SHA384` or `HMAC-SHA512`. If the Hash header is not provided, the default algorithm will be `HMAC-SHA256`.\n## Request headers\n>\n\n| Header key | Value description | Value example |\n |--------------|-----------|------------|\n| X-LA-APIKEY | `Client Public\
    \ Key` | dfa1234546546353-dfa32423432-e4a17781e |\n| X-LA-SIGNATURE | `Request signature` | 45dec0cf062d5f79f94fa34d0e7a6c58cafe8bb5a00b34175226e579a1812775 |\n| X-LA-DIGEST | `Hash function (optional)` | HMAC-SHA512 |\n\n\n## Signature\nThe signature of the request is created by using your `Private Key` to sign the `method` **+** `api endpoint` **+** `query string (optional, without '?' at the begining)` **+** `body params (optional, without '?' at the begining)` of the request. For example, if we want to make request to see our orders, we would use `https://api.latoken.com/v2/auth/order` request. In that case, we would need to sign `GET/v2/auth/order` part of request, and the result of signing should be placed in X-LA-SIGNATURE header. You can see signature examples in different languages below in the section Request Samples. Before signing the body params and/or query string, it should be made into a correctly formatted string according to the following rules:\n* all the entries are\
    \ joined with ‘&’, and each entry is a concatenation of key, ‘=’ sign and value.\n  * if value is a string, number or boolean than use its string representation (without double-quotes)\n  * if value is an object, then recursively build it, and use concatenation of ‘{’, built value, ‘}’.\n  * if value is an array, then recursively build it like an object, but each entry is just a value. Built values are joined with ‘&’, and use concatenation of ‘[’, built value, ‘]’.\n\n# Withdrawal procedure\n\n**Using Endpoints:** \n* [/v2/auth/transaction/withdraw](/#operation/withdrawMoney)\n* [/v2/auth/transaction/withdraw/confirm](/#operation/confirmWithdrawal)\n\n**Permissions in API-key:**  `WITHDRAW_WALLET`, `BYPASS_TWOFA`(optional)\n\nSend a request to withdraw funds using [/v2/auth/transaction/withdraw](/#operation/withdrawMoney) using an API-key with has ``WITHDRAW_WALLET``-permission.\n\n  The Full Access API-key has ``BYPASS_TWOFA``-permission, which means that the ``twoFaCode`` is not required\
    \ to withdraw your funds. So you can omit the field ``twoFaCode``, or set an empty string and it will be accepted. The other required fields should be set as usual.\n\n  If your API-key doesn't have ``BYPASS_TWOFA``-permission, the request must contain your ``twoFaCode`` and the other required fields.\n  \n  * **Google 2FA** / **Withdrawal 2FA**: use the generated code as the ``twoFaCode``\n  * **SMS 2FA**: To receive SMS OTP Code, send a correctly formatted withdrawal request with an empty ``twoFaCode``  field, after which you'll receive the SMS. Now repeat the signed API request, with the ``twoFaCode``=SMS 2FA-code which you just received.\n  \nIf you receive the response that a code is required (`codeRequired=true`), an email has been sent to you with the confirmation code. The transaction has the status: `TRANSACTION_STATUS_UNVERIFIED`.\n\n  *  When you receive the code via email, send a signed API request to confirm the transaction using [/v2/auth/transaction/withdraw/confirm](/#operation/confirmWithdrawal),\
    \ which needs the transaction-id and the received code. \n  \nAfter confirmation with code from email or if there was no code required, the tranaction has the status: ``TRANSACTION_STATUS_PENDING`` or ``TRANSACTION_STATUS_CHECKING`` and it will be completed.\n\n\n# Request Samples On JavaScript, Python, PHP, Java, C#\nTo Slide down to `JavaScript, Python, PHP, Java, C#` samples just click on an endpoint:\n- [/v2/currency](/#operation/getActiveCurrencies) *(get active currencies)*\n- [/v2/auth/account](/#operation/getBalancesByUser) *(get balances)*\n- [/v2/auth/account/filtered](/#operation/getBalancesByUserCurrenciesAndTypes) *(get balances of current user, filtered by currencies and account types)*\n- [/v2/auth/order](/#operation/getMyOrders) *(get all my orders)*\n- [/v2/auth/order/place](/#operation/placeOrder) *(placing a new order)*\n- [/v2/auth/order/cancel](/#operation/cancelOrder) *(cancel one order by ID)*\n- [/v2/auth/transaction/withdraw](/#operation/withdrawMoney) *(request\
    \ withdrawal)*\n- [/v2/auth/transaction/withdraw/cancel](/#operation/cancelWithdrawal) *(cancel withdrawal)*\n- [/v2/auth/spot/deposit](/#operation/depositSpotAccount) *(deposit spot account)*\n"
  title: Latoken Public API
