        source: "\nconst request = require('request')\nconst crypto = require('crypto')\n\nconst apiKey = 'Your Latoken API key'\nconst apiSecret = 'Your Latoken API secret'\nconst method = 'POST';\nconst baseUrl = 'https://api.latoken.com'\nconst endpoint = '/v2/auth/order/placeBuilk'\n\nconst order_params = [{\n    baseCurrency: 'LA',\n    quoteCurrency: 'USDT',\n    side: 'SELL',\n    condition: 'GTC',\n    type: 'LIMIT',\n    clientOrderId: 'my-wonderful-order-number-71566',\n    price: 0.06909,\n    quantity: 3.21\n    }, \n    {\n    'baseCurrency': 'd663138b-3ec1-436c-9275-b3a161761523',\n    'quoteCurrency': '0c3a106d-bde3-4c13-a26e-3fd2394529e5',\n    'side': 'BUY',\n    'condition': 'IOC',\n    'type': 'MARKET',\n    'clientOrderId': 'my-wonderful-market-order-number-453',\n    'quantity': '50'\n    }]\n\nconst order_params2 = {\n  orders : order_params\n}\nvar order_amount = order_params.length; var bodySignArray = {}; for (var i = 0; i < order_amount; i++) {\n    var orderSignParams\
          \ = '{'+Object.entries(order_params[i]).map(([key, val]) =>\n       key + '=' + val).join('&')+'}';\n    bodySignArray.push(orderSignParams);\n} const bodySignParams = 'orders=['+bodySignArray.join('&')+']';\nconst signature = crypto\n    .createHmac('sha256', apiSecret)\n    .update(method + endpoint + bodySignParams)\n    .digest('hex')\n\nconst options = {\n    method: method,\n    url: baseUrl + endpoint,\n    headers: {\n        'Content-Type': 'application/json',\n        'X-LA-APIKEY': apiKey,\n        'X-LA-SIGNATURE': signature\n    },\n    body: order_params2\n}\n\nrequest.post(\n    options,\n    function (error, response, responseBody) {\n        console.log('response:', JSON.stringify(responseBody))\n    }\n)\n\n"
