        source: "\nconst request = require('request')\nconst crypto = require('crypto')\n\nconst apiKey = 'Your Latoken API key'\nconst apiSecret = 'Your Latoken API secret'\nconst method = 'POST';\nconst baseUrl = 'https://api.latoken.com'\nconst endpoint = '/v2/auth/order/cancelBuilk'\n\nconst order_params = [{\n    id: '12609cf4-fca5-43ed-b0ea-b40fb48d3b0d'\n    },\n    {\n    id: '12609cf4-fca5-43ed-b0ea-b40fb48d3b0e'\n    },\n    {\n    id: '12609cf4-fca5-43ed-b0ea-b40fb48d3b0d'\n    }];\n\nconst order_params2 = {\n    orders: order_params\n};\nvar order_amount = order_params.length;  var bodySignArray = {};  for (var i = 0; i < order_amount; i++) {\n   var orderSignParams = '{'+Object.entries(order_params[i]).map(([key, val]) =>\n       key + '=' + val).join('&')+'}';\n   bodySignArray.push(orderSignParams);\n}  const bodySignParams = 'orders=['+bodySignArray.join('&')+']';\nconst signature = crypto\n    .createHmac('sha256', apiSecret)\n    .update(method + endpoint + bodySignParams)\n\
          \    .digest('hex')\n\nconst options = {\n    method: method,\n    url: baseUrl + endpoint,\n    headers: {\n        'Content-Type': 'application/json',\n        'X-LA-APIKEY': apiKey,\n        'X-LA-SIGNATURE': signature\n    },\n    bodySignParams: bodySignParams\n}\n\nrequest.post(\n    options,\n    function (error, response, responseBody) {\n        console.log('response:', JSON.stringify(responseBody))\n    }\n)\n\n"
