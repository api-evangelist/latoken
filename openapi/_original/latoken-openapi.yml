        source: "import requests\nimport datetime\nimport hashlib\nimport hmac\n\napiKey = 'Your Latoken API key'\napiSecret = b'Your Latoken API secret'\nbaseUrl = 'https://api.latoken.com'\nendpoint = '/v2/auth/order/placeBulk'\n\norder_params = [{\n    'baseCurrency': 'LA',\n    'quoteCurrency': 'USDT',\n    'side': 'SELL',\n    'condition': 'GTC',\n    'type': 'LIMIT',\n    'clientOrderId': 'my-wonderful-order-number-71566',\n    'price': '0.06909',\n    'quantity': '3.21',\n    'timestamp': int(datetime.datetime.now().timestamp()*1000)\n    },\n    {\n    'baseCurrency': 'd663138b-3ec1-436c-9275-b3a161761523',\n    'quoteCurrency': '0c3a106d-bde3-4c13-a26e-3fd2394529e5',\n    'side': 'BUY',\n    'condition': 'IOC',\n    'type': 'MARKET',\n    'clientOrderId': 'my-wonderful-market-order-number-453',\n    'quantity': '50',\n    'timestamp': int(datetime.datetime.now().timestamp()*1000)\n    }]\n\norder_params2 = {\n    'orders': order_params\n}\n\nparam_list = [] for order in order_params:\n\
          \    serializeFunc = map(lambda it : it[0] + '='+str(it[1]),\n           order.items())\n    orderParams = '&'.join(serializeFunc)\n    param_list.append('{'+orderParams+'}')\nbodyParams = 'orders=['+'&'.join(param_list)+']'\nsignature = hmac.new(\n    apiSecret, \n    ('POST' + endpoint + bodyParams).encode('ascii'), \n    hashlib.sha512\n)\n\nurl = baseUrl + endpoint\n\nresponse = requests.post(\n    url,\n    headers = {\n        'Content-Type': 'application/json',\n        'X-LA-APIKEY': apiKey,\n        'X-LA-SIGNATURE': signature.hexdigest(),\n        'X-LA-DIGEST': 'HMAC-SHA512'\n    },\n    json = order_params2\n)\n\nprint(response.json())"
