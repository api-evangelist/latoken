  json_CancelOrderReply:
    type: object
    title: CancelOrderReply
    allOf:
    - $ref: '#/definitions/json_ReplyBase'
    - properties:
        id:
          readOnly: false
          description: ''
          type: string
    example:
      id: 12345678-1234-1244-1244-123456789012
      message: cancellation request successfully submitted
      status: SUCCESS
      error: ''
      errors: {}
    description: Base reply for all methods
  json_CancelBulkOrderReply:
    type: object
    title: CancelBulkOrderReply
    properties:
      status:
        type: string
        description: operation status, can only be "SUCCESS", means server has accepted a request
      message:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              description: UUID of the cancelled order
              example: ea8330dc-d9a1-48fd-80e6-b7f48be32c74
            message:
              example: Validation errors
              readOnly: false
              description: Short description of cancelling operation
              type: string
            status:
              example: FAILURE
              enum:
              - FAILURE
              - SUCCESS
              description: status description
              type: string
            error:
              readOnly: false
              enum:
              - VALIDATION_ERROR
              - NOT_FOUND
              description: error codes, present if status is not SUCCESS
              type: string
            errors:
              readOnly: false
              description: more verbose description of which request fields are not valid, present if status is not SUCCESS
              type: object
              additionalProperties:
                type: string
    example:
      All orders cancelled:
      - message:
        - id: 32434058-a010-4330-820b-2fbe82321c91
          message: cancellation request successfully submitted
          status: SUCCESS
        - id: 81c09e54-da43-4ad6-88bf-07c4348dd587
          message: cancellation request successfully submitted
          status: SUCCESS
        status: SUCCESS
      If any order is not valid:
      - message:
        - id: c9865516-ab5b-4c2a-947c-2606d1b501dd
          message: Order cancellation aborted due to invalid request in the bulk
          error: VALIDATION_ERROR
          status: FAILURE
        - id: null
          message: Validation errors
          error: VALIDATION_ERROR
          errors:
            id: must not be blank,must not be null
          status: FAILURE
        status: SUCCESS
    description: Base reply for all methods
  json_CancelStopOrderReply:
