apis:
- aid: latoken:latoken-api-v2
  name: LATOKEN Public API V2
  description: REST API for the LATOKEN exchange - public market data (currencies, pairs, tickers, order books, trades, candles, time) and signed endpoints (paths under /auth/) for accounts, spot, stop and bulk orders, trades, transfers, transactions and withdrawals. Signed requests carry X-LA-APIKEY and an HMAC X-LA-SIGNATURE.
  humanURL: https://api.latoken.com/doc/v2/
  baseURL: https://api.latoken.com/v2
  tags:
  - Cryptocurrency
  - Exchanges
  - Trading
  - Market Data
  properties:
  - type: OpenAPI
    url: openapi/latoken-openapi.yml
  - type: OpenAPI
    name: OpenAPI (provider-hosted)
    url: https://api.latoken.com/doc/v2/swagger.json
  - type: Documentation
    url: https://api.latoken.com/doc/v2/
- aid: latoken:latoken-p2p-api
  name: LATOKEN P2P API
  description: LATOKEN P2P API v1 (base path /pay/v1) for the exchange's peer-to-peer marketplace, signed with the same X-LA-APIKEY / X-LA-SIGNATURE headers as the REST API.
  humanURL: https://api.latoken.com/doc/p2p/
  baseURL: https://api.latoken.com/pay/v1
  tags:
  - Cryptocurrency
  - P2P
  properties:
  - type: OpenAPI
    url: openapi/latoken-p2p-openapi.yml
  - type: OpenAPI
    name: OpenAPI (provider-hosted)
    url: https://api.latoken.com/doc/p2p/swagger.json
  - type: Documentation
    url: https://api.latoken.com/doc/p2p/
- aid: latoken:latoken-websocket-api
  name: LATOKEN Public WebSocket API
  description: STOMP-over-WebSocket API at wss://api.latoken.com/stomp with public market-data and private account topics. Documented in prose only; the provider's Swagger file for it carries no paths, and no AsyncAPI is published.
  humanURL: https://api.latoken.com/doc/ws/
  baseURL: wss://api.latoken.com/stomp
  tags:
  - WebSockets
  - Market Data
  properties:
